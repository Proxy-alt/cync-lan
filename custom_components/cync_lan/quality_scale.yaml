# Self-assessment against developers.home-assistant.io/docs/core/integration-quality-scale/checklist
# Every "done" claim below was verified by an actual pytest run against
# pytest-homeassistant-custom-component (425 tests, 97% line coverage on
# custom_components/cync_lan as of this writing - not just static review).
# "todo" items are real, identified gaps, not hedging.

rules:
  # ------------------------------- Bronze -------------------------------
  action-setup:
    status: done
    comment: >-
      services.py's 15 experimental_* services are registered idempotently in
      async_setup_entry (hass.services.has_service guard) and removed in
      async_unload_entry only once no Cync LAN entry remains loaded. Tested
      in test_services.py. Motion/ambient sensor tuning's raw service is
      kept for automations, but its primary surface is now the options
      flow's guided "Edit Motion Sensor Settings" wizard (device picker ->
      physical-wake gate, checking bridge.is_online() exactly like the real
      app's own equivalent check -> settings form) - see
      reconfiguration-flow below. Group power is a
      third kind: its cmd_code is fully confirmed (reuses set_power exactly),
      what's unconfirmed is whether firmware honors a group-range target
      address at all - see docs/mesh_opcodes.md's "Groups control" section.
      Indicator LED's service is kept for backward compatibility but is no
      longer the primary surface - it's confirmed working on real hardware
      now, so it's also exposed as 4 real entities (number.py/select.py/
      switch.py), both routed through the same bridge.py cache so they
      can't diverge. delete_scene/delete_schedule/toggle_automation are a
      fourth, riskier kind: their outer command byte is directly confirmed
      (not the hardcoded-0x8E relay bug), but whether the real command even
      rides over the same connection cync-lan intercepts at all is
      unconfirmed (the app builds it via a structurally different framer -
      see docs/cync_automations.md). Wired in anyway as an explicit
      real-hardware experiment at the user's request; both
      _warn_experimental_cmd_code and a new
      _warn_experimental_transport_unconfirmed log on first use.
      set_group_membership is a fifth kind: op_code/dispatch method
      confirmed (the trustworthy f()/mo14054f envelope, not the 0x8E
      family), cmd_code predicted via the length formula - genuinely new
      functionality (group membership management, not just control of an
      existing group), targeting an individual device rather than the
      bridge/a group address. Scene activation (execute_scene) and
      schedule enable/disable (toggle_automation) are unusual: their own
      cmd_code caveats are unchanged, but they're now ALSO exposed as real
      entities (scene.py's CyncLanScene, switch.py's CyncLanScheduleSwitch)
      rather than staying service-only - unlike motion-sensor tuning
      (which needs a multi-field form the wizard exists to walk through),
      activating a scene or toggling a schedule has no fields to fill out
      beyond "which one," so a real entity is a strict UX improvement with
      no added risk over the raw service - same command, same caveats,
      reachable without knowing a numeric ID. The raw services remain
      registered for existing automations/scripts built against them.
      experimental_push_automation_to_hardware is a sixth, orchestration
      kind: it doesn't send one predicted command, it validates an
      existing HA automation's own trigger/condition/action config (time
      trigger + optional day-of-week condition + light.turn_on actions
      targeting Cync lights only) and then chains four of the functions
      above (create_scene/add_to_scene/create_schedule/add_automation) to
      recreate it natively on the hub, so the same schedule keeps running
      even if HA itself is offline. Inherits every one of those
      functions' own experimental-transport caveats, plus its own new one:
      the Hub notification channel used to learn the allocated
      scene_id/schedule_id is a distinct HDLC/PPP-style frame format
      (src/cync_lan/packet/xlink_legacy.py) whose presence on cync-lan's
      TCP connection at all is unconfirmed (see docs/cync_automations.md).
      experimental_add_device_to_scene/experimental_remove_device_from_scene
      are a seventh kind: standalone versions of the same add_to_scene/
      remove_from_scene functions push_automation_to_hardware already uses
      internally, added so they're independently testable against a scene
      you already have rather than only reachable through the full
      automation-push flow. remove_from_scene is unusual among every
      command in this integration in that BOTH device product-family
      branches are dispatch-confirmed from decompiled source (no
      unconfirmed format guessed at for either) - only cmd_code is
      predicted, same as everything else.
      experimental_set_multicolor_gradient_mode/
      experimental_set_multicolor_segment_count/
      experimental_set_multicolor_segments are an eighth kind: 3 raw wire
      primitives for a materially bigger feature (custom MultiColor
      scheme programming on segmented light strips) this integration
      deliberately does NOT fully build out - only the individually-
      confirmed primitives are exposed, chunking/ordering for more than 2
      segments is left to the caller. Two sibling commands
      (SetMultiColorSchemeDirectCommand/SetMultiColorBitmapCommand)
      dispatch via methods never traced anywhere else in this project's
      research and are out of scope entirely, not just unwired.
  appropriate-polling:
    status: exempt
    comment: >-
      local_push integration - device state is pushed over the persistent
      TCP connection, never polled. The periodic device-*list* refresh
      (async_track_time_interval, default 24h, user-configurable) is a
      deliberate low-frequency background task, not device state polling.
  brands:
    status: done
    comment: >-
      brand/icon.png (256x256) and brand/icon@2x.png (512x512) bundled
      locally under custom_components/cync_lan/brand/, supported without a
      home-assistant/brands PR as of HA 2026.3.0. Placeholder artwork (no
      existing "Cync LAN" brand identity to draw from), functional rather
      than polished.
  common-modules:
    status: done
    comment: >-
      Shared state/dispatch logic centralized in bridge.py; shared entity
      boilerplate (unique_id, device_info, availability, dispatcher
      subscription) centralized in entity.py's CyncLanEntity base class.
  config-flow-test-coverage:
    status: done
    comment: >-
      test_config_flow.py covers user/otp/confirm, every error branch
      (invalid_auth, invalid_otp, cannot_connect, no_devices), duplicate-
      account abort, reauth (success + 2 failure modes), and the options
      flow. config_flow.py itself: 96% line coverage.
  config-flow:
    status: done
    comment: >-
      Full UI setup wizard (config_flow.py). entry.data holds only
      credentials (immutable identity); entry.options holds user-changeable
      settings (local port, export refresh interval).
  dependency-transparency:
    status: done
    comment: >-
      manifest.json's requirements previously referenced a git+https URL
      (github.com/Proxy-alt/cync-lan); as of Home Assistant 2026.1, core's
      requirement parser strictly validates against PEP 508 and rejects
      git+https:// requirement URLs outright (home-assistant/core#160450),
      making that approach unusable at all, not just non-ideal. Worked
      around for a while by vendoring the cync_lan protocol package
      directly under custom_components/cync_lan/vendor/ - resolved
      properly by extracting that code into its own cync-lan package,
      published to PyPI, on a new `core` branch. manifest.json's
      requirements now lists a real, pinned, independently-versioned PyPI
      dependency (cync-lan>=0.1.0) instead of a vendored copy; the
      vendor/ directory and const.py's sys.path bootstrap are gone. uvloop
      remains out of requirements entirely (no PyPI wheels for newer
      CPython ABIs yet) - it's still only referenced under TYPE_CHECKING
      in cync-lan's own structs.py/server.py, never constructed on any
      code path this integration uses.
  docs-actions:
    status: done
    comment: >-
      strings.json's "services" block documents all 15 experimental_*
      services and their fields, each description explicitly flagging what's
      actually unconfirmed for that specific command - predicted cmd_code
      for most, the target address too for scenes, for group power
      specifically (its cmd_code is confirmed) whether firmware honors a
      group-range target at all, for delete_scene/delete_schedule/
      toggle_automation specifically (their cmd_code is confirmed) whether
      the command rides over the same connection cync-lan intercepts at all,
      and for set_group_membership (op_code/dispatch confirmed, cmd_code
      predicted, same caveat class as most others).
  docs-triggers:
    status: exempt
    comment: No custom triggers defined (standard entity-state triggers apply).
  docs-conditions:
    status: exempt
    comment: No custom conditions defined.
  docs-high-level-description:
    status: done
    comment: README.md "What this is".
  docs-installation-instructions:
    status: done
    comment: README.md "Prerequisites" + "Installing the integration".
  docs-removal-instructions:
    status: done
    comment: README.md "Removing the integration".
  entity-event-setup:
    status: done
    comment: >-
      CyncLanEntity.async_added_to_hass subscribes via
      async_dispatcher_connect + self.async_on_remove - not done in
      __init__, which runs before the entity has a hass instance. Tested in
      test_entity.py.
  entity-unique-id:
    status: done
    comment: Every entity sets unique_id in CyncLanEntity.__init__.
  has-entity-name:
    status: done
    comment: >-
      _attr_has_entity_name = True on CyncLanEntity and the diagnostic
      sensor. Deliberate exception: scene.py's CyncLanScene and switch.py's
      CyncLanScheduleSwitch do NOT set has_entity_name - a scene/schedule's
      own name (e.g. "Movie Night") is its complete identity, not a facet
      of the "Cync LAN Bridge" device it's attached to for grouping;
      combining them would read as "Cync LAN Bridge Movie Night" in the
      scene picker, which doesn't match how scene platforms from other
      integrations behave.
  runtime-data:
    status: done
    comment: CyncLanRuntimeData dataclass stored on entry.runtime_data.
  test-before-configure:
    status: done
    comment: >-
      config_flow's _finish_export pulls the real device list and requires
      a non-zero count before allowing entry creation - a bad account or
      empty home fails during setup, not silently after.
  test-before-setup:
    status: done
    comment: >-
      async_setup_entry polls ncync_server.running with a timeout before
      returning True, raising ConfigEntryNotReady on bind failure/timeout.
      Tested in test_init.py (both the success and timeout paths).
  unique-config-entry:
    status: done
    comment: >-
      async_set_unique_id(username) + _abort_if_unique_id_configured().
      Tested (test_duplicate_account_aborts).

  # ------------------------------- Silver -------------------------------
  action-exceptions:
    status: done
    comment: >-
      services.py's _resolve_device/_resolve_bridge_entry raise
      ServiceValidationError with a clear message for an unknown device_id,
      a device belonging to another integration, or (for
      experimental_execute_scene specifically) an individual device passed
      where the bridge device is required. Tested in test_services.py.
  config-entry-unloading:
    status: done
    comment: >-
      async_unload_entry stops the TCP listener, cancels its task, cancels
      both the periodic-refresh and no-devices-check listeners, clears any
      open repair issue, and unloads platforms. Tested in test_init.py.
  docs-configuration-parameters:
    status: done
    comment: README.md "Configuration parameters" table.
  docs-installation-parameters:
    status: done
    comment: Covered in README.md's "Installing the integration" (only inputs are account email/password/OTP).
  entity-unavailable:
    status: done
    comment: >-
      CyncLanEntity.available reflects bridge.is_online(dev_id), fed by two
      distinct signals now, not just one. The original path (mesh status
      broadcasts reporting a device with a stale/"not recently seen" flag)
      only detects a device going offline if OTHER devices keep relaying
      broadcasts that still mention it - it never covered the device that
      directly owns its own TCP connection (a WiFi plug/switch/bulb) simply
      losing power or network and its session ending, since nothing that
      device's dev_id stops appearing at all in that case rather than
      appearing with a stale flag. Fixed: CyncTCPSession.close() (devices.py)
      now marks that session's own node offline immediately, covering every
      real path that reaches close() - lost power (confirmed via write()'s
      own "device probably dropped the connection" detection, which
      previously logged the finding but never acted on it), a network drop,
      or a deliberate reconnect cycle (MITM mode toggling briefly flips
      availability too - correct, not a regression, since that's a real,
      if brief, disconnect). Tested (test_close_marks_its_own_node_offline/
      test_close_is_a_noop_for_online_when_no_node_is_set in
      test_devices.py).
  integration-owner:
    status: done
    comment: 'manifest.json codeowners: ["@Proxy-alt"].'
  log-when-unavailable:
    status: done
    comment: >-
      bridge.py's _set_online (shared by pub_online, parse_entity_state, and
      publish_motion_state) logs "Cync device X is now online/offline" only
      on an actual transition, not every call - it fires on every status
      packet, so logging unconditionally would be pure noise. Tested in
      test_bridge.py (3 tests covering all 3 call paths).
  parallel-updates:
    status: done
    comment: >-
      PARALLEL_UPDATES = 0 declared and explicitly justified in each
      platform module (light/switch/fan/binary_sensor/number/select/sensor/
      scene) - the protocol layer serializes its own commands per bridge
      connection, so entities don't need HA-side throttling.
  reauthentication-flow:
    status: done
    comment: >-
      async_step_reauth/async_step_reauth_confirm implemented; 3 tests
      covering success, invalid auth, and connection failure.
  test-coverage:
    status: done
    comment: >-
      98% overall line coverage on custom_components/cync_lan (1352
      statements, 27 missed), measured with pytest-cov against a real 293-
      test run. number.py/select.py/sensor.py/switch.py/scene.py/entity.py/
      util.py all at 100%. Remaining gaps are in __init__.py's rarely-hit
      background-task error branches, config_flow.py's exception logging
      branches, and binary_sensor.py's setup-entry edge cases.

  # -------------------------------- Gold ---------------------------------
  devices:
    status: done
    comment: build_device_info() gives every entity a proper DeviceInfo (identifiers/connections/manufacturer/model). Tested.
  diagnostics:
    status: done
    comment: diagnostics.py, redacts credentials and MAC addresses. Tested.
  discovery-update-info:
    status: exempt
    comment: >-
      Discovery (see below) is account-level, not per-device - it only
      ever triggers setup of a brand-new config entry (or aborts if one
      already exists). There's no scenario where a discovery event should
      update an *existing* entry's stored data, since that data is cloud
      account credentials, not network/device info a DHCP match could
      refresh.
  discovery:
    status: done
    comment: >-
      Two independent discovery paths, both confirmed against real device
      behavior:

      DHCP: Cync devices get a lease with a recognizable hostname pattern
      (manifest.json's "dhcp": [{"hostname": "ge_*"}]). async_step_dhcp
      nudges the user into the normal account-credentials flow rather
      than requiring them to find this integration manually; a fixed
      sentinel unique_id collapses multiple devices' DHCP matches into a
      single discovery flow instead of one per device.

      Bluetooth: manifest.json's "bluetooth" matcher (local_name
      "telink_mesh1", manufacturer_id 529/0x0211 - Telink's Bluetooth SIG
      company ID) only ever fires for a factory-default, never-provisioned
      device - its advertised name changes the instant it's actually
      provisioned into a mesh (see cync_lan.ble_provision's
      FACTORY_ADVERTISED_NAME). That's a fundamentally different signal
      than DHCP's: a factory-fresh device isn't part of any Cync account
      yet, so async_step_bluetooth deliberately does NOT nudge into
      account setup (which would be premature) - it surfaces an
      informational step pointing at the Cync app or the
      cync-lan-ble-provision CLI tool instead. Doesn't declare "bluetooth"
      as a manifest dependency (deliberately - this integration never
      calls the runtime bluetooth API, only receives the discovery match,
      so requiring the bluetooth component to actually initialize would
      be over-broad and was confirmed to break setup in a bare test
      environment missing an unrelated transitive dependency of HA's own
      usb component).
  docs-data-update:
    status: done
    comment: README.md "How data updates".
  docs-examples:
    status: done
    comment: README.md "Example automations".
  docs-known-limitations:
    status: done
    comment: README.md "Known limitations".
  docs-supported-devices:
    status: done
    comment: README.md "Supported devices and functions", links to the dependency's known_devices.md.
  docs-supported-functions:
    status: done
    comment: Same section as docs-supported-devices.
  docs-troubleshooting:
    status: done
    comment: README.md "Troubleshooting".
  docs-use-cases:
    status: done
    comment: >-
      README.md "Use cases" - offline resilience, automation latency,
      network privacy, and cross-brand composition, distinct from the
      example-automations recipes.
  dynamic-devices:
    status: todo
    comment: >-
      Improved but not complete. Device *removal* is now fully dynamic: the
      periodic refresh diffs the device set and deletes stale devices from
      the device registry directly (device registry removal cascades to
      their entities too), no reload needed - see stale-devices. New
      devices are now detected promptly too, not just on the (possibly
      hours-away, or disabled) periodic timer: devices.py's existing
      "Received MeshInfo for unknown device ID" branch
      (_process_73_mesh_info) now calls bridge.report_unknown_device_id(),
      which debounces (must see the same ID
      UNKNOWN_DEVICE_SEEN_THRESHOLD=3 times - MeshInfo entries are
      individually-addressed real devices, not the noisy group/broadcast
      pseudo-IDs the per-status-packet path sees, so this is a trustworthy
      signal) and rate-limits (max once per
      UNKNOWN_DEVICE_TRIGGER_COOLDOWN_SECONDS=900s, protecting the real
      Cync cloud API from being hammered) before triggering the same
      _refresh_export_and_reload_if_changed the periodic timer uses. A
      matching no-op was added to the real MQTTClient for the existing
      MQTT-based add-on, which doesn't have anywhere to trigger a
      re-export from itself. All of this is tested (test_bridge.py,
      test_init.py), including a regression test for a real bug this work
      surfaced: bridge.pub_online was a plain `def` when devices.py's
      actual call site wraps it directly in asyncio.create_task(), which
      requires a coroutine - fixed to `async def`, confirmed against the
      real MQTTClient.pub_online. What's still missing: addition still
      means a full entry reload once triggered, not incremental
      async_add_entities-based addition of just the new device - that
      still needs the per-platform callback registry / entity-building
      refactor described previously, a larger architectural change not
      attempted here.
  entity-category:
    status: done
    comment: >-
      CyncLanAppMeshActiveSensor sets entity_category = EntityCategory.
      DIAGNOSTIC. The 4 indicator-LED entities (select.py's mode/color,
      number.py's brightness, switch.py's wifi_disconnect_blink) are
      EntityCategory.CONFIG - real hardware-confirmed device settings, not
      primary function. sensor.py's motion-schedule-slot sensors are
      EntityCategory.DIAGNOSTIC - read-only device facts. Tested.
  entity-device-class:
    status: done
    comment: SwitchDeviceClass.OUTLET/SWITCH in switch.py; motion/occupancy device_class in binary_sensor.py. Tested.
  entity-disabled-by-default:
    status: done
    comment: >-
      CyncLanAppMeshActiveSensor and CyncLanMitmModeSwitch (switch.py) are
      both disabled by default via DEFAULT_DISABLED_ENTITIES. Tested.
  entity-translations:
    status: done
    comment: >-
      binary_sensor's motion/app_mesh_active, select.py's mode/color
      (including per-option state translations), number.py's brightness,
      switch.py's wifi_disconnect_blink, and sensor.py's schedule-slot
      sensors (including the translation_placeholders-based disambiguated
      name for a device in 2+ groups) all resolve through translation_key +
      strings.json rather than a hardcoded literal - confirmed end-to-end in
      test_entity_translations.py, which runs a real config entry through
      full setup and asserts the resolved friendly_name in hass.states (not
      just that the translation_key attribute is set).
  exception-translations:
    status: done
    comment: >-
      __init__.py's ConfigEntryNotReady raises use translation_domain/
      translation_key/translation_placeholders, matching strings.json's
      exceptions block, for all 3 startup-failure paths.
  icon-translations:
    status: done
    comment: >-
      icons.json provides state-based icon overrides for binary_sensor
      entities with a translation_key (motion, app_mesh_active,
      app_wifi_active: on/off) and light.py's CyncLanLightGroup
      (cync_light_group: off/unavailable), resolved through the same
      translation_key mechanism verified end-to-end for entity-translations
      above. The "unavailable" state icon is included defensively (harmless
      if unsupported) - unlike "off", HA's icon-translation state lookup
      for "unavailable" specifically isn't confirmed/documented; the
      frontend may just dim whatever icon is already showing instead.
  reconfiguration-flow:
    status: done
    comment: >-
      CyncLanOptionsFlow opens on a menu (async_show_menu): "General
      settings" is the original local_port/export_refresh_interval/light-
      groups form, unchanged. "Edit motion sensor settings" is a guided
      wizard mirroring the real Cync app's own flow for the same
      operation - device picker (filtered to has_motion_sensor, same as
      binary_sensor.py) -> a wake-gate step that checks
      bridge.is_online(dev_id) (confirmed via decompiled-source research
      to be exactly what the real app itself checks - there's no separate
      BLE "discoverable" state, see docs/mesh_opcodes.md's "Operational
      prerequisite" section) and shows the real app's own wake
      instructions if offline, re-checking on each submit -> a settings
      form that calls node.set_motion_sensor_settings() directly and ends
      with an abort-as-confirmation screen rather than persisting bogus
      options data. Unlike the raw experimental_set_motion_sensor_settings
      service, this wizard can't be pointed at an offline device by
      accident. Tested (test_config_flow.py's
      test_motion_sensor_wizard_* tests, 10 covering the device filter,
      the wake gate in both directions, mid-flow device removal, and the
      settings payload itself).
  repair-issues:
    status: done
    comment: >-
      A one-shot check 10 minutes after setup (async_call_later) creates a
      non-fixable WARNING repair issue if no device has connected yet - a
      near-certain sign the DNS redirection prerequisite isn't in place.
      Cleared automatically once a device connects, and on unload. Tested
      in test_init.py (create, clear-on-connect, clear-on-unload).
  stale-devices:
    status: done
    comment: >-
      The periodic refresh now diffs the device set for removals
      specifically and deletes them from the device registry directly
      (_remove_stale_devices), rather than only detecting "changed" and
      reloading. A refresh with only removals no longer reloads the entry
      at all. Tested in test_init.py.

  # ------------------------------ Platinum -------------------------------
  async-dependency:
    status: done
    comment: >-
      The cync-lan package's protocol code (devices.py, server.py) is
      asyncio-native throughout, and cloud_api.py accepts an injected
      session (see inject-websession) rather than always creating its own.
      Now published to PyPI as a versioned, semver-guaranteed package (see
      dependency-transparency) with a py.typed marker - the remaining gap
      this rule used to cite is resolved.
  inject-websession:
    status: done
    comment: >-
      cloud_api.py's CyncCloudAPI now accepts an optional session= kwarg;
      when provided it's used instead of self-creating a session, and
      close() correctly never closes a caller-injected session (verified
      directly, not just assumed - test_util.py). util.get_cloud_api(hass)
      threads Home Assistant's own shared session
      (homeassistant.helpers.aiohttp_client.async_get_clientsession)
      through every one of the 5 call sites in config_flow.py/__init__.py.
      Backward compatible: callers elsewhere in cync_lan that construct
      CyncCloudAPI() with no session kwarg keep self-creating and
      self-closing their own session exactly as before (also tested).
  strict-typing:
    status: done
    comment: >-
      This integration's own code passes `mypy --strict` cleanly (see
      mypy.ini; run as `mypy -p custom_components.cync_lan`). cync-lan (the
      upstream package) ships a py.typed marker, and its
      GlobalObject.mqtt_client/.export_server attributes are typed against
      Protocol classes (cync_lan/protocols.py) instead of importing
      concrete addon types - this pass also caught and fixed a real bug in
      that Protocol (MqttSink.pub_online was declared as a plain `def`
      instead of `async def`, published as cync-lan 0.1.2). The only
      remaining strict-mode gaps are entirely inside the installed cync-lan
      dependency itself (GlobalObject, nCyncServer.start/stop,
      CyncTCPSession.start_mitm/stop_mitm, CyncCloudAPI.__init__/
      _check_session lack full annotations) - out of scope for this
      integration's own code to fix, tracked as a future cync-lan effort.
