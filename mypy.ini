[mypy]
namespace_packages = True
explicit_package_bases = True
strict = True

# custom_components/cync_lan/ has no repo-root __init__.py chain, so mypy
# needs explicit_package_bases (above) to resolve it as
# custom_components.cync_lan rather than colliding with the installed
# cync_lan package's own module names (both would otherwise be inferred
# as top-level "cync_lan.<module>" - see quality_scale.yaml's
# strict-typing entry). Run as:
#   mypy -p custom_components.cync_lan
#
# This used to record the remaining strict-mode gaps as living in the
# installed cync-lan dependency (nCyncServer.start/stop,
# CyncTCPSession.start_mitm/stop_mitm, CyncCloudAPI.__init__) and therefore
# "out of scope for this integration's own code to fix". They were in scope
# after all - the two repositories have the same author - and cync-lan 0.9.1
# annotates them, which is why requirements_test.txt pins at least that.
# strict mode is clean as of that pin; a no-untyped-call error reappearing
# here means the dependency regressed, not that this file needs relaxing.
