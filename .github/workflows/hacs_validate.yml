name: HACS validation

on:
  push:
    branches:
      - feature/ha-custom-component
  pull_request:
    paths:
      - "custom_components/**"
      - "hacs.json"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
