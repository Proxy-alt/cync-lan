name: Label pull requests

# `pull_request_target` rather than `pull_request`, because a PR from a fork
# gets a read-only token and could not label itself otherwise - and every
# outside contribution arrives from a fork.
#
# That trigger runs with a write token in the context of the base branch, so
# the usual rule applies: DO NOT add a checkout step here, and do not run
# anything from the PR's tree. actions/labeler reads changed paths through the
# API and never executes contributor code, which is what makes it safe under
# this trigger. Anything added to this job must keep that property.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          # Additive only. `sync-labels: true` would strip any label named in
          # labeler.yml once its rule stopped matching, including one a human
          # applied deliberately - so a maintainer marking a PR `protocol` for
          # review reasons would see it silently removed on the next push.
          sync-labels: false
