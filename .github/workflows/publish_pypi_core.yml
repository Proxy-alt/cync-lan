name: Release + PyPI publish - core package

# Release pipeline: for a version that hasn't been tagged/released yet, tag
# the commit, create a GitHub release with that version's CHANGELOG
# section, and publish to PyPI via Trusted Publishing (no stored token - see
# RELEASING.md).
#
# Release vs prerelease is decided from the version string alone, by the
# "Classify the version" step below:
#
#   0.4.0    -> full release
#   0.4.0b1  -> prerelease (a beta)
#
# The bN form means *digits*, and is the same rule on all three artifacts.
# It is not a style choice here: this package uploads to PyPI, so its
# version must be valid PEP 440, and PEP 440's pre-release segment is `b`
# followed by a number. A commit sha is rejected -
# packaging.version.Version("0.4.0b2aad577") raises InvalidVersion, and the
# upload would fail after the tag and GitHub release had already been
# created. The `+sha` local-version form is valid PEP 440 but PyPI refuses
# local versions on upload, so that is no escape hatch either.
#
# The filename still says "publish_pypi" so the Actions UI keeps this
# workflow's run history, which is keyed by path.
#
# The header used to claim it ran "the test suite on every push", but the
# paths filter below is `pyproject.toml`, so tests only ever ran on a
# version bump - a push that changed devices.py ran nothing at all. Routine
# testing now lives in tests.yml (every push and every PR); this workflow
# keeps its own test job purely as a release gate.

on:
  push:
    branches:
      - core
    paths:
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: write

# Serialised, never cancelled. Two publishes racing can both pass the
# "does this tag exist" check and then both try to upload; cancelling one
# mid-flight is worse still, since the tag and GitHub release are created
# before the PyPI upload and would be left behind without it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          # This job installs the project's own extras, so the resolve is worth
          # caching. The build jobs below only install `build` and are left
          # uncached - a restore/save round trip there costs more than it saves.
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[ble,dev]"
      - run: pytest tests/ -q

  prerelease:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Read the version from pyproject.toml
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=cync-lan-v$version" >> "$GITHUB_OUTPUT"

      # The only place release-vs-prerelease is decided. Both shapes are
      # matched explicitly and anything else is a hard error, so a version
      # PyPI would reject fails here - before the tag and GitHub release are
      # created - rather than at the upload step with both already in place.
      - name: Classify the version
        id: classify
        run: |
          version="${{ steps.version.outputs.version }}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # --latest=false: three independently-versioned artifacts share
            # this repo's release list, and Latest belongs to the HA
            # integration (the one HACS surfaces), not to whichever tag is
            # newest by date.
            echo "flags=--latest=false" >> "$GITHUB_OUTPUT"
            echo "kind=release" >> "$GITHUB_OUTPUT"
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+b[0-9]+$ ]]; then
            echo "flags=--prerelease" >> "$GITHUB_OUTPUT"
            echo "kind=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Version '$version' is neither X.Y.Z (release) nor X.Y.ZbN (prerelease). PyPI requires PEP 440, so a beta must be bN with digits - a commit sha is not a valid version here."
            exit 1
          fi

      - name: Check whether this tag already exists
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # A full release must have a hand-written CHANGELOG entry - gating on
      # that is the point. Betas fall back to a generated stub, so a quick
      # bN build does not need a changelog edit to get out the door.
      - name: Extract this version's CHANGELOG section
        if: steps.check.outputs.exists == 'false'
        run: |
          python3 - "${{ steps.version.outputs.version }}" CHANGELOG.md "${{ steps.classify.outputs.kind }}" <<'PYEOF'
          import re, sys
          version, changelog_path, kind = sys.argv[1], sys.argv[2], sys.argv[3]
          text = open(changelog_path, encoding="utf-8").read()
          pattern = re.compile(rf"^### {re.escape(version)}$\n(.*?)(?=^### |\Z)", re.M | re.S)
          match = pattern.search(text)
          if match:
              notes = match.group(1).strip()
          elif kind == "prerelease":
              notes = (
                  f"Automated beta build of `{version}`.\n\n"
                  "Betas do not require a CHANGELOG entry, and none was found "
                  "for this version. Install with `pip install --pre cync-lan`."
              )
          else:
              sys.exit(f"Could not find a CHANGELOG.md entry for version {version!r}")
          with open("/tmp/release-notes.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")
          PYEOF

      - name: Create the ${{ steps.classify.outputs.kind }}
        if: steps.check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "cync-lan ${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release-notes.md \
            ${{ steps.classify.outputs.flags }} \
            --target "${{ github.sha }}"

  check_pypi:
    needs: prerelease
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - name: Check whether this version is already live on PyPI
        id: check
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/cync-lan/${{ needs.prerelease.outputs.version }}/json")
          if [ "$status" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: [prerelease, check_pypi]
    # Deliberately independent of prerelease's tag-existence check: a tag/
    # GitHub release can already exist while the actual PyPI publish never
    # succeeded (e.g. the Trusted Publisher wasn't configured yet on an
    # earlier run) - gate on PyPI's own state instead, so a workflow_dispatch
    # re-run can retry the publish step alone without needing a new version.
    if: needs.check_pypi.outputs.published == 'false'
    runs-on: ubuntu-latest
    environment: pypi-core
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
