name: Tests

# This package had no test suite and no test CI at all - 2,456 lines,
# including a 1,900-line MQTT client, with nothing verifying any of it.

on:
  push:
    branches:
      - python
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the real floor: this depends on cync-lan, whose structs.py
        # imports enum.StrEnum and whose cloud_api.py uses datetime.UTC.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]" pytest pytest-asyncio
      - run: pytest tests/ -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
