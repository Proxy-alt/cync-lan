name: Tests

on:
  push:
    branches:
      - feature/ha-custom-component
      - python
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.14, not 3.13: requirements_test.txt pins
          # pytest-homeassistant-custom-component >=0.13.346, and that
          # release requires Python >=3.14. On 3.13 pip resolves no
          # candidate at all and the install step fails before any test runs.
          python-version: "3.14"
          cache: pip
          # This branch has no requirements.txt and no root pyproject.toml,
          # so setup-python's default cache key finds nothing and the step
          # hard-fails. Point it at the file that does exist.
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run tests
        run: pytest tests -q

      # Non-blocking: the remaining strict-mode gaps are all untyped
      # functions inside the installed cync-lan dependency, not this
      # integration's own code - see mypy.ini. Reported so a NEW error
      # introduced here is visible, without failing the build on the
      # known dependency-side ones.
      - name: Type check
        continue-on-error: true
        run: mypy -p custom_components.cync_lan

  docs-in-sync:
    name: docs match the canonical copy on core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      # docs/ is mirrored on core, python and feature/ha-custom-component
      # because each is a separately published artifact. core is canonical.
      # mesh_opcodes.md had already drifted 9 lines between branches before
      # this check existed, so nothing catches it but CI.
      - name: Compare docs/ against origin/core
        run: |
          git fetch --no-tags --depth=1 origin core
          if ! git diff --quiet FETCH_HEAD -- docs/; then
            echo "docs/ differs from the canonical copy on the core branch:"
            git --no-pager diff --stat FETCH_HEAD -- docs/
            echo
            echo "Copy the updated files from core, or update core first."
            exit 1
          fi
          echo "docs/ is in sync with core"
