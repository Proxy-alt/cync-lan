name: Tests

on:
  push:
    branches:
      - feature/ha-custom-component
      - python
  pull_request:
  workflow_dispatch:

# One run per ref. Pushing twice in quick succession otherwise runs both
# to completion, and only the newer result is meaningful.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # 3.14, not 3.13: requirements_test.txt pins
          # pytest-homeassistant-custom-component >=0.13.346, and that
          # release requires Python >=3.14. On 3.13 pip resolves no
          # candidate at all and the install step fails before any test runs.
          python-version: "3.14"
          cache: pip
          # This branch has no requirements.txt and no root pyproject.toml,
          # so setup-python's default cache key finds nothing and the step
          # hard-fails. Point it at the file that does exist.
          cache-dependency-path: requirements_test.txt

      - run: python -m pip install --upgrade pip
      # Retry: this repo releases cync-lan and this integration back to back,
      # and PyPI's simple index can lag the publish API by a few minutes. A
      # just-released pin then resolves locally but not on a fresh runner,
      # which has produced three spurious red builds.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            pip install -r requirements_test.txt && exit 0
            echo "attempt $attempt failed; the index may not have the "\
                 "just-published cync-lan yet - waiting 30s"
            sleep 30
          done
          exit 1

      - name: Run tests
        run: pytest tests -q

      # Non-blocking: the remaining strict-mode gaps are all untyped
      # functions inside the installed cync-lan dependency, not this
      # integration's own code - see mypy.ini. Reported so a NEW error
      # introduced here is visible, without failing the build on the
      # known dependency-side ones.
      - name: Type check
        continue-on-error: true
        run: mypy -p custom_components.cync_lan

  docs-in-sync:
    name: docs match the canonical copy in cync-lan-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # docs/ is mirrored into each artifact's repository because each is a
      # separately published artifact. Proxy-alt/cync-lan-lib is canonical.
      # mesh_opcodes.md had already drifted 9 lines between copies before
      # this check existed, so nothing catches it but CI.
      #
      # This used to fetch the `core` branch of this same repository, back
      # when all three artifacts shared one. The library has its own
      # repository now, so the fetch is cross-repo - it is public, so no
      # token is needed.
      - name: Compare docs/ against the canonical copy
        run: |
          git remote add canonical https://github.com/Proxy-alt/cync-lan-lib.git
          git fetch --no-tags --depth=1 canonical main
          if ! git diff --quiet FETCH_HEAD -- docs/; then
            echo "docs/ differs from the canonical copy in Proxy-alt/cync-lan-lib:"
            git --no-pager diff --stat FETCH_HEAD -- docs/
            echo
            echo "Copy the updated files from cync-lan-lib, or update it first."
            exit 1
          fi
          echo "docs/ is in sync with cync-lan-lib"
