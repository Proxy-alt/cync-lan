name: Tests

# Routine CI for the core package. publish_pypi_core.yml also runs the
# tests, but only as a release gate - its `paths: pyproject.toml` filter
# means it never fires for an ordinary code change, and it has no
# pull_request trigger at all. This workflow is the one that actually
# guards day-to-day commits.

on:
  push:
    branches:
      - core
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must cover the floor declared by pyproject's requires-python.
        # 3.12, not 3.11: structs.py's enum.StrEnum and cloud_api.py's
        # datetime.UTC put the floor at 3.11, but devices.py also uses a
        # PEP 701 nested-quote f-string, which is 3.12+. Running the floor
        # here is the point - it is what catches syntax the local
        # interpreter happens to accept.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[ble,dev]"
      - run: pytest tests/ -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      # pyproject has configured ruff since the package was split out, but
      # nothing ever ran it - there were 444 outstanding violations,
      # including three undefined names that raised NameError at runtime.
      - run: ruff check src/ tests/ scripts/
      - run: ruff format --check src/ tests/ scripts/

  cmd-code-audit:
    name: cmd_code audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[ble,dev]"
      # Every command's cmd_code length field must match the body it
      # describes. This caught a systematic off-by-one across all six hub
      # commands, which would make firmware read a truncated body and fail
      # silently.
      - run: python scripts/cmd_code.py audit
