name: Release - HA integration

# Automatically creates a GitHub release every time
# custom_components/cync_lan/manifest.json's version changes on this
# branch - see RELEASING.md. Tagged vX.Y.Z - distinct from the python
# package's own cync-lan-vX.Y.Z tags (see the core branch's
# publish_pypi_core.yml), since the two are versioned and released
# independently.
#
# Release vs prerelease is decided from the version string alone, by the
# "Classify the version" step below:
#
#   2.3.0     -> full release, marked Latest
#   2.3.0b1   -> prerelease (a beta)
#
# The bN form is shared with the two PyPI packages on the core and python
# branches, deliberately: their versions must be valid PEP 440, whose
# pre-release segment is `b` followed by a number. One rule for all three
# artifacts beats a per-artifact exception nobody remembers.
#
# This used to pass --prerelease unconditionally, on the reasoning that
# every command is still EXPERIMENTAL so nothing is "stable". That cost
# more than it bought: HACS hides prereleases unless the user ticks the
# beta box per-repository, so the normal install path saw *no* versions at
# all. Experimental-ness is documented in the README's Known limitations,
# which is where it belongs - it is not what the prerelease flag is for.
#
# The filename still says "prerelease" so the Actions UI keeps this
# workflow's run history, which is keyed by path.

on:
  push:
    branches:
      - feature/ha-custom-component
    paths:
      - "custom_components/cync_lan/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

# Serialised, never cancelled. Two publishes racing can both pass the
# "does this tag exist" check and then both try to upload; cancelling one
# mid-flight is worse still, since the tag and GitHub release are created
# before the PyPI upload and would be left behind without it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Gate the release on the suite, the way publish_pypi_core.yml and
  # publish_pypi_addon.yml already do. Without this the tag and GitHub
  # release were created regardless - v2.0.0 shipped while Tests was red.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          # 3.14, not 3.13: requirements_test.txt pins
          # pytest-homeassistant-custom-component >=0.13.346, and that
          # release requires Python >=3.14. On 3.13 pip resolves no
          # candidate at all and the install step fails before any test runs.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      # Retry: this repo releases cync-lan and this integration back to back,
      # and PyPI's simple index can lag the publish API by a few minutes. A
      # just-released pin then resolves locally but not on a fresh runner,
      # which has produced three spurious red builds.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            pip install -r requirements_test.txt && exit 0
            echo "attempt $attempt failed; the index may not have the "\
                 "just-published cync-lan yet - waiting 30s"
            sleep 30
          done
          exit 1
      - run: pytest tests -q

  prerelease:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Read the version from manifest.json
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/cync_lan/manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # The only place release-vs-prerelease is decided. Both shapes are
      # matched explicitly and anything else is a hard error, so a typo
      # ("2.3.O", "2.3") fails the run loudly instead of quietly shipping as
      # the wrong kind - the failure mode that motivated this step.
      - name: Classify the version
        id: classify
        run: |
          version="${{ steps.version.outputs.version }}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # --latest: this repo ships three independently-versioned
            # artifacts from one release list, and the HA integration is the
            # one HACS surfaces, so it should hold Latest rather than
            # whichever tag happens to be newest by date.
            echo "flags=--latest" >> "$GITHUB_OUTPUT"
            echo "kind=release" >> "$GITHUB_OUTPUT"
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+b[0-9]+$ ]]; then
            echo "flags=--prerelease" >> "$GITHUB_OUTPUT"
            echo "kind=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Version '$version' is neither X.Y.Z (release) nor X.Y.ZbN (prerelease)."
            exit 1
          fi

      - name: Check whether this tag already exists
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # A full release must have a hand-written CHANGELOG entry - gating on
      # that is the point. A commit beta cannot have one: its version embeds
      # the sha of the commit that carries it, so the entry could only be
      # written by amending after the fact. Betas therefore fall back to a
      # generated stub rather than failing the run.
      - name: Extract this version's CHANGELOG section
        if: steps.check.outputs.exists == 'false'
        run: |
          python3 - "${{ steps.version.outputs.version }}" custom_components/cync_lan/CHANGELOG.md "${{ steps.classify.outputs.kind }}" <<'PYEOF'
          import re, sys
          version, changelog_path, kind = sys.argv[1], sys.argv[2], sys.argv[3]
          text = open(changelog_path, encoding="utf-8").read()
          pattern = re.compile(rf"^### {re.escape(version)}$\n(.*?)(?=^### |\Z)", re.M | re.S)
          match = pattern.search(text)
          if match:
              notes = match.group(1).strip()
          elif kind == "prerelease":
              notes = (
                  f"Automated beta build of `{version}`.\n\n"
                  "Betas do not require a CHANGELOG entry, and none was found "
                  "for this version. Not a supported release."
              )
          else:
              sys.exit(f"Could not find a CHANGELOG.md entry for version {version!r}")
          with open("/tmp/release-notes.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")
          PYEOF

      - name: Create the ${{ steps.classify.outputs.kind }}
        if: steps.check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "cync_lan (Home Assistant custom_component) ${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release-notes.md \
            ${{ steps.classify.outputs.flags }} \
            --target "${{ github.sha }}"
