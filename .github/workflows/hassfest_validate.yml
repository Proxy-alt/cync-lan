name: Hassfest validation

on:
  push:
    branches:
      - feature/ha-custom-component
  pull_request:
    paths:
      - "custom_components/**"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
