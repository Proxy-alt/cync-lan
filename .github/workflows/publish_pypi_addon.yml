name: Prerelease + PyPI publish - cync-lan-mqtt add-on

# Automatically creates a GitHub prerelease every time pyproject.toml's
# version changes on this branch - see RELEASING.md. Always a prerelease:
# this package has never had a formal stable-release process. Tagged
# cync-lan-mqtt-vX.Y.Z - distinct from the core cync-lan library's own
# cync-lan-vX.Y.Z tags (see the core branch's publish_pypi_core.yml) and
# the HA integration's own vX.Y.Z tags, since all three are versioned and
# released independently. Publishes to PyPI via Trusted Publishing (no
# stored token - see RELEASING.md) once the prerelease is created.

on:
  push:
    branches:
      - python
    paths:
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Read the version from pyproject.toml
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=cync-lan-mqtt-v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether this tag already exists
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract this version's CHANGELOG section
        if: steps.check.outputs.exists == 'false'
        run: |
          python3 - "${{ steps.version.outputs.version }}" CHANGELOG.md <<'PYEOF'
          import re, sys
          version, changelog_path = sys.argv[1], sys.argv[2]
          text = open(changelog_path, encoding="utf-8").read()
          pattern = re.compile(rf"^### {re.escape(version)}$\n(.*?)(?=^### |\Z)", re.M | re.S)
          match = pattern.search(text)
          if not match:
              sys.exit(f"Could not find a CHANGELOG.md entry for version {version!r}")
          with open("/tmp/release-notes.md", "w", encoding="utf-8") as f:
              f.write(match.group(1).strip() + "\n")
          PYEOF

      - name: Create the prerelease
        if: steps.check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "cync-lan-mqtt ${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release-notes.md \
            --prerelease \
            --target "${{ github.sha }}"

  publish:
    needs: prerelease
    if: needs.prerelease.outputs.exists == 'false'
    runs-on: ubuntu-latest
    environment: pypi-mqtt
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
