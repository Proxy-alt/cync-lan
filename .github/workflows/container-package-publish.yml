name: Docker - publish multi-arch packages

# Publishes the cync-lan-mqtt add-on as a multi-arch container image to
# GitHub Packages (ghcr.io), and optionally to Docker Hub.
#
# This workflow had never once succeeded before 2026-07: every run failed at
# the build step with
#
#     failed to read dockerfile: open Dockerfile: no such file or directory
#
# because it passed `context: .` and no `file:`, so buildx looked for
# ./Dockerfile at the repo root while the actual one lives in docker/. The
# context genuinely does need to be the repo root (the Dockerfile does
# `COPY ./ .` for the python source and `COPY web/` for the Vite build stage),
# so only `file:` was wrong.
#
# Two other things were broken behind it and would have surfaced next:
#
#   * The image name came from ${{ github.repository }} = "Proxy-alt/cync-lan",
#     which contains an uppercase P. Container registries reject non-lowercase
#     names.
#   * The Docker Hub push used secrets.DOCKER_HUB_KEY, and this repository has
#     no secrets configured at all. That step is now gated on the secret
#     actually existing, so a missing Docker Hub credential can no longer take
#     the GitHub Packages publish down with it.

on:
  release:
    types: [ published ]
  workflow_dispatch:

env:
  # Lowercase and explicit. Named for the artifact rather than the repo:
  # three separately-versioned things ship from this repository (see
  # RELEASING.md) and only this one is a container.
  IMAGE_NAME: proxy-alt/cync-lan-mqtt

  # linux/arm/v7 was in this list and is deliberately not any more. It has
  # never actually built: neither uvloop nor cffi publishes an armv7l wheel,
  # so pip falls back to compiling from source, and python:3.14-slim-bookworm
  # ships no C compiler - "configure: error: no acceptable C compiler found
  # in $PATH", after ~4 minutes of QEMU-emulated work. amd64 and arm64 built
  # cleanly in the same run; the failure was armv7-only.
  #
  # Supporting it would mean adding a full build toolchain to the image, and
  # cryptography (a cync-lan dependency) has no armv7l wheel either, so that
  # pulls in Rust as well - all compiled under emulation, on every build.
  # Not worth it for a 32-bit target that Home Assistant itself has moved
  # away from. arm64 covers Raspberry Pi 3/4/5 on any 64-bit OS.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    # Guards against the other release-creating workflows in this project
    # (the HA custom_component's prerelease_ha_integration.yml, and the core
    # library's publish_pypi_core.yml on the `core` branch) - all of them
    # create GitHub releases, which also fire this workflow's
    # release:published trigger. This image is built from the cync-lan-mqtt
    # add-on specifically, so only its own cync-lan-mqtt-vX.Y.Z tags should
    # trigger a build. workflow_dispatch runs are unaffected (no release
    # event to check tag_name against).
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'cync-lan-mqtt-v')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      # Read into env so the steps below can test it. `secrets` is not
      # reliably available in a step-level `if:`; env is.
      DOCKER_HUB_KEY: ${{ secrets.DOCKER_HUB_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The release tag is cync-lan-mqtt-vX.Y.Z, which docker/metadata-action
      # cannot parse as semver on its own - left to its defaults it would tag
      # the image with the whole prefixed tag. Strip the prefix and tag with
      # the bare version instead.
      - name: Derive the image version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${{ github.event.release.tag_name }}"
            version="${version#cync-lan-mqtt-v}"
          else
            version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Betas (X.Y.ZbN - see RELEASING.md) must not move the `latest`
          # tag; someone pulling :latest should never land on a prerelease.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Building version '$version' (latest=$([[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && echo true || echo false))"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------------
      # GitHub Packages (ghcr.io) - the primary registry
      # ---------------------------------------------------------------

      - name: Log into registry ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (ghcr.io)
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.latest == 'true' }}
          # image.source is what links the package to this repository in the
          # GitHub Packages UI and lets it inherit repo permissions. The
          # Dockerfile's own LABEL still pointed at baudneo/cync-lan, the
          # upstream this was forked from, which would have attached the
          # package to somebody else's repo.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Local async MQTT controller for Cync/C by GE Wi-Fi devices
            org.opencontainers.image.licenses=MIT

      - name: Build and push to ghcr.io
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ env.PLATFORMS }}

      # ---------------------------------------------------------------
      # Docker Hub - optional, and must never block the above
      # ---------------------------------------------------------------

      - name: Log into registry docker.io
        if: github.event_name != 'pull_request' && env.DOCKER_HUB_KEY != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME || github.actor }}
          password: ${{ secrets.DOCKER_HUB_KEY }}

      - name: Extract Docker metadata (docker.io)
        id: meta2
        if: env.DOCKER_HUB_KEY != ''
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: docker.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.latest == 'true' }}

      - name: Build and push to docker.io
        if: env.DOCKER_HUB_KEY != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta2.outputs.tags }}
          labels: ${{ steps.meta2.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ env.PLATFORMS }}

      - name: Note when Docker Hub was skipped
        if: env.DOCKER_HUB_KEY == ''
        run: |
          echo "::notice::DOCKER_HUB_KEY is not set, so only GitHub Packages (ghcr.io) was published. Set DOCKER_HUB_KEY (and optionally DOCKER_HUB_USERNAME) in repository secrets to also publish to Docker Hub."
