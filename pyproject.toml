[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cync-lan-mqtt"
version = "0.1.1"
description = "Docker/MQTT add-on for local async MQTT control of Cync/C by GE smart devices (DNS redirection required) - built on the cync-lan core protocol library"
readme = "README.md"
authors = [{name = "baudneo", email = "86508179+baudneo@users.noreply.github.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.9"
dependencies = [
    "cync-lan>=0.1.0",
    "pyyaml==6.0.2",
    "uvloop>=0.21.0",
    "aiomqtt==2.3.0",
    "paho-mqtt",
    "aiohttp>=3.10.8",
    "fastapi>=0.115.12",
    "uvicorn>=0.34.3",
]

[project.optional-dependencies]
dev = [
    "python-dotenv>=1.1.0",
]

[project.scripts]
cync-lan = "cync_lan_mqtt.main:main"

[project.urls]
Homepage = "https://github.com/Proxy-alt/cync-lan"
Repository = "https://github.com/Proxy-alt/cync-lan"
Issues = "https://github.com/Proxy-alt/cync-lan/issues"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
