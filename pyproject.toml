[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cync-lan-mqtt"
version = "0.2.2"
description = "Docker/MQTT add-on for local async MQTT control of Cync/C by GE smart devices (DNS redirection required) - built on the cync-lan core protocol library"
keywords = ["cync", "c-by-ge", "cbyge", "ge-lighting", "savant", "home-assistant", "homeassistant", "smart-home", "home-automation", "local-control", "bluetooth-mesh", "telink", "iot", "asyncio"]
readme = "README.md"
authors = [{name = "baudneo", email = "86508179+baudneo@users.noreply.github.com"}]
classifiers = [
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Development Status :: 4 - Beta",
    "Topic :: Communications",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.12"
dependencies = [
    "cync-lan>=0.2.1",
    "pyyaml>=6.0.2",
    "uvloop>=0.21.0",
    "aiomqtt==2.5.1",
    "paho-mqtt",
    "aiohttp>=3.10.8",
    "fastapi>=0.115.12",
    "uvicorn>=0.34.3",
]

[project.optional-dependencies]
dev = [
    "python-dotenv>=1.1.0",
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
cync-lan = "cync_lan_mqtt.main:main"

[project.urls]
Homepage = "https://github.com/Proxy-alt/cync-lan"
Repository = "https://github.com/Proxy-alt/cync-lan"
Issues = "https://github.com/Proxy-alt/cync-lan/issues"

[tool.ruff]
line-length = 88
target-version = "py312"  # must match requires-python

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# `ruff format` owns line length for code; E501 only fires on long log
# strings and docstrings the formatter will not split. Same rationale as the
# core package's pyproject.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
