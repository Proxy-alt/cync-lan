[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cync-lan"
version = "0.3.0"
description = "Core async protocol library for local LAN control of Cync/C by GE smart devices - device/session state machine, packet codec, cloud auth, and BLE provisioning"
readme = "README.md"
authors = [{name = "baudneo", email = "86508179+baudneo@users.noreply.github.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
    "pydantic>=2.0.0",
    "tzlocal>=5.3.1",
    "cryptography>=46.0.7",
    "aiohttp>=3.10.8",
]

[project.optional-dependencies]
dev = [
    "python-dotenv>=1.1.0",
    "pytest",
    "pytest-asyncio",
]
ble = [
    "bleak>=0.22.0",
]

[project.scripts]
cync-lan-ble-provision = "cync_lan.ble_provision:main"

[project.urls]
Homepage = "https://github.com/Proxy-alt/cync-lan"
Repository = "https://github.com/Proxy-alt/cync-lan"
Issues = "https://github.com/Proxy-alt/cync-lan/issues"

[tool.setuptools.package-data]
cync_lan = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py312"  # must match requires-python - see the Python floor note there

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# `ruff format` owns line length for code. E501 only ever fires on what the
# formatter deliberately will not split - long log strings, docstrings and
# URLs - where the only "fix" is hand-wrapping a string literal. Enforcing
# the formatter in CI covers the real intent; keeping E501 on top of it just
# produced ~150 unfixable warnings that made `ruff check` useless to read.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
